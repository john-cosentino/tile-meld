<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160">
  <defs>
    <pattern id="hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3fe0ff" stroke-width="1.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="420" height="160" fill="#0a0e1a"/>
  <rect x="0" y="0" width="420" height="160" fill="url(#hatch)"/>

  <line x1="0" y1="20" x2="420" y2="20" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="0" y1="140" x2="420" y2="140" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="20" y1="0" x2="20" y2="160" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="400" y1="0" x2="400" y2="160" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="40" y="35" width="340" height="90" fill="none" stroke="#3fe0ff" stroke-width="2" stroke-dasharray="7,7"/>
  <text x="210" y="80" text-anchor="middle" font-family="monospace" font-size="16" fill="#3fe0ff">DO NOT BAKE DIGITS HERE</text>
  <text x="210" y="102" text-anchor="middle" font-family="monospace" font-size="13" fill="#3fe0ff">live "01:12" countdown text renders on top</text>

  <text x="210" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffc94d" font-weight="bold">Recessed LCD-style bezel -- dark inset panel, thin bright edge</text>
  <text x="6" y="154" font-family="monospace" font-size="9" fill="#58e08a">countdown-screen-bezel.png -- 420x160 -- nine-slice: 20/20/20/20 -- rendered 260x60 (desktop) / 150x30 (landscape)</text>
</svg>
