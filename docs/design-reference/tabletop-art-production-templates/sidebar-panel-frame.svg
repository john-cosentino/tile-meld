<svg xmlns="http://www.w3.org/2000/svg" width="580" height="440" viewBox="0 0 580 440">
  <defs>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#3fe0ff" stroke-width="1.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="580" height="440" fill="#0a0e1a"/>
  <rect x="0" y="0" width="580" height="440" fill="url(#hatch)"/>

  <line x1="0" y1="24" x2="580" y2="24" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="0" y1="416" x2="580" y2="416" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="24" y1="0" x2="24" y2="440" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="556" y1="0" x2="556" y2="440" stroke="#ff5fa8" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="0" y="0" width="24" height="24" fill="#ffc94d" opacity="0.18"/>
  <rect x="556" y="0" width="24" height="24" fill="#ffc94d" opacity="0.18"/>
  <rect x="0" y="416" width="24" height="24" fill="#ffc94d" opacity="0.18"/>
  <rect x="556" y="416" width="24" height="24" fill="#ffc94d" opacity="0.18"/>
  <text x="290" y="16" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffc94d" font-weight="bold">ONE reusable frame for turn/move-log/tip panels -- notched border + subtle glow</text>

  <rect x="40" y="30" width="500" height="380" fill="none" stroke="#3fe0ff" stroke-width="2" stroke-dasharray="7,7"/>
  <text x="290" y="220" text-anchor="middle" font-family="monospace" font-size="18" fill="#3fe0ff">LIVE CONTENT -- DO NOT PLACE TEXT HERE</text>
  <text x="290" y="250" text-anchor="middle" font-family="monospace" font-size="13" fill="#3fe0ff">(turn status / move-log entries / tip text render on top)</text>

  <text x="6" y="432" font-family="monospace" font-size="10" fill="#58e08a">sidebar-panel-frame.png -- 580x440 -- nine-slice: 24/24/24/24 -- rendered 290x220 (desktop) / 184x68 (portrait support-row) / 170x175 (landscape)</text>
</svg>
