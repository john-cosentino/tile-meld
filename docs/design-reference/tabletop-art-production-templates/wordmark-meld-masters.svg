<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900">
  <defs>
    <pattern id="hatch" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#3fe0ff" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="2400" height="900" fill="#0a0e1a"/>
