  <rect x="4" y="4" width="2392" height="892" fill="none" stroke="#ff5fa8" stroke-width="6"/>
  <text x="1200" y="80" text-anchor="middle" font-family="monospace" font-size="34" fill="#ffc94d" font-weight="bold">wordmark-meld-masters.png -- 2400 x 900 -- TRANSPARENT canvas</text>
  <text x="1200" y="450" text-anchor="middle" font-family="monospace" font-size="46" fill="#3fe0ff">FULL CANVAS IS THE ILLUSTRATION</text>
  <text x="1200" y="510" text-anchor="middle" font-family="monospace" font-size="30" fill="#9fb0c9">Fixed-size asset -- no nine-slice, no live-content safe zone.</text>
  <text x="1200" y="550" text-anchor="middle" font-family="monospace" font-size="30" fill="#9fb0c9">Center "MELD MASTERS" lockup with margin on all sides;</text>
  <text x="1200" y="590" text-anchor="middle" font-family="monospace" font-size="30" fill="#9fb0c9">do not crop bevel/shadow at the canvas edge.</text>
  <text x="1200" y="850" text-anchor="middle" font-family="monospace" font-size="26" fill="#58e08a">Rendered via CSS object-fit:contain at 980x118 (desktop) / 300x70 (phone portrait) / 260x46 (phone landscape)</text>
